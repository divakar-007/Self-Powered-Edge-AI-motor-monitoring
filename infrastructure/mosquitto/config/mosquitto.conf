# Mosquitto MQTT Configuration for Industrial Sensor Gateway
listener 1883 0.0.0.0
allow_anonymous true

# WebSocket listener for direct browser MQTT clients (optional)
listener 9001 0.0.0.0
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Connection limits
max_connections -1
max_queued_messages 1000
